name: "GitOps - Cloud Destroy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the Terraform workspace to destroy"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod
      confirm_environment:
        description: "Type the exact workspace name to confirm destruction"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  TF_VERSION: "1.16.2"

# Prevent simultaneous Terraform operations in this repository.
concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

jobs:
  terraform-destroy:
    name: "Destroy Selected Workspace Infrastructure"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        shell: bash
        working-directory: ./application-infra

    steps:
      - name: Validate Destruction Confirmation
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM_ENVIRONMENT: ${{ inputs.confirm_environment }}
        run: |
          if [[ "$CONFIRM_ENVIRONMENT" != "$TARGET_ENVIRONMENT" ]]; then
            echo "::error::Confirmation must exactly match the selected workspace."
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials Using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialize Terraform Backend
        run: terraform init -input=false

      - name: Select and Verify Workspace
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          terraform workspace select "$TARGET_ENVIRONMENT"
          SELECTED_WORKSPACE="$(terraform workspace show)"

          if [[ "$SELECTED_WORKSPACE" != "$TARGET_ENVIRONMENT" ]]; then
            echo "::error::Selected workspace does not match the requested environment."
            exit 1
          fi

          echo "Verified workspace: $SELECTED_WORKSPACE"
            
      - name: Review Destruction Plan
        run: terraform plan -destroy -input=false -no-color
      
      - name: Destroy Workspace Infrastructure
        run: terraform destroy -input=false -auto-approve

