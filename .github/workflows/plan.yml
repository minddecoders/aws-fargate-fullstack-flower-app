name: "GitOps - Security Plan"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select the target infrastructure environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  TF_VERSION: "1.16.2"

jobs:
  terraform-plan:
    name: "Security Audit and Terraform Plan"
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./application-infra

    steps:
      - name: "Checkout Codebase"
        uses: actions/checkout@v4

      - name: "Run Checkov Security Scan"
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./application-infra
          framework: terraform
          output_format: cli
          soft_fail: true

      - name: "Configure AWS Credentials Using OIDC"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: ${{ env.AWS_REGION }}

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "Check Terraform Formatting"
        run: terraform fmt -check -recursive

      - name: "Initialize Terraform Backend"
        run: terraform init -input=false

      # 🔄 REALIGNED: Completely removed 'env: TF_WORKSPACE' wrapper block to avoid CLI locking conflicts!
      - name: "Select Terraform Workspace"
        run: |
          TARGET_ENV="${{ inputs.environment }}"
          echo "Target environment selected: $TARGET_ENV"

          if terraform workspace list | sed 's/^[* ]*//' | grep -Fxq "$TARGET_ENV"; then
            terraform workspace select "$TARGET_ENV"
          else
            terraform workspace new "$TARGET_ENV"
          fi

          terraform workspace show

      - name: "Validate Terraform Configuration"
        run: terraform validate

      # 🔄 REALIGNED: Replaced env lock with explicit '-var' variables payload for your secure database password!
      - name: "Generate Terraform Plan"
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -out=tfplan

      - name: "Upload Terraform Plan Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.environment }}
          path: application-infra/tfplan
          if-no-files-found: error
          retention-days: 3
