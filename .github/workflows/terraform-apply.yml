
name: "GitOps - Custom Manual Tag Deploy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select target infrastructure environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

      backend_strategy:
        description: "Backend action"
        required: true
        default: build
        type: choice
        options:
          - build
          - reuse
          - skip

      backend_tag:
        description: "Backend image tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
        type: string

      frontend_strategy:
        description: "Frontend action"
        required: true
        default: build
        type: choice
        options:
          - build
          - reuse
          - skip

      frontend_tag:
        description: "Frontend image tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  BACKEND_REPO: minddecoders/aws-fargate-fullstack-app
  FRONTEND_REPO: minddecoders/aws-fargate-fullstack-frontend
  TF_VERSION: "1.16.2"

jobs:
  build-backend:
    name: "Build and Push Backend"
    runs-on: ubuntu-latest
    if: ${{ inputs.backend_strategy == 'build' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Backend Tag
        env:
          IMAGE_TAG: ${{ inputs.backend_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid backend Docker tag: $IMAGE_TAG"
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-api
          file: ./backend-api/Dockerfile
          push: true
          tags: ${{ env.BACKEND_REPO }}:${{ inputs.backend_tag }}

  build-frontend:
    name: "Build and Push Frontend"
    runs-on: ubuntu-latest
    if: ${{ inputs.frontend_strategy == 'build' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Frontend Tag
        env:
          IMAGE_TAG: ${{ inputs.frontend_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid frontend Docker tag: $IMAGE_TAG"
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-app
          file: ./frontend-app/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_REPO }}:${{ inputs.frontend_tag }}

  terraform-deploy:
    name: "Validate Images and Deploy to AWS"
    runs-on: ubuntu-latest

    needs:
      - build-backend
      - build-frontend

    if: >-
      ${{
        always() &&
        (inputs.backend_strategy != 'skip' || inputs.frontend_strategy != 'skip') &&
        (needs.build-backend.result == 'success' || needs.build-backend.result == 'skipped') &&
        (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
      }}

    environment: ${{ inputs.environment }}

    defaults:
      run:
        shell: bash
        working-directory: ./application-infra

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Image Tag Inputs
        env:
          BACKEND_STRATEGY: ${{ inputs.backend_strategy }}
          FRONTEND_STRATEGY: ${{ inputs.frontend_strategy }}
          BACKEND_TAG: ${{ inputs.backend_tag }}
          FRONTEND_TAG: ${{ inputs.frontend_tag }}
        run: |
          for entry in \
            "$BACKEND_STRATEGY:$BACKEND_TAG" \
            "$FRONTEND_STRATEGY:$FRONTEND_TAG"; do

            strategy="${entry%%:*}"
            tag="${entry#*:}"

            if [[ "$strategy" != "skip" && ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "Invalid Docker image tag: $tag"
              exit 1
            fi
          done

      - name: Login to Docker Hub for Image Reuse
        if: ${{ inputs.backend_strategy == 'reuse' || inputs.frontend_strategy == 'reuse' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify Reused Images Exist
        env:
          BACKEND_STRATEGY: ${{ inputs.backend_strategy }}
          FRONTEND_STRATEGY: ${{ inputs.frontend_strategy }}
          BACKEND_TAG: ${{ inputs.backend_tag }}
          FRONTEND_TAG: ${{ inputs.frontend_tag }}
          BACKEND_REPO: ${{ env.BACKEND_REPO }}
          FRONTEND_REPO: ${{ env.FRONTEND_REPO }}
        run: |
          if [[ "$BACKEND_STRATEGY" == "reuse" ]]; then
            echo "Checking backend image: $BACKEND_REPO:$BACKEND_TAG"
            docker manifest inspect "$BACKEND_REPO:$BACKEND_TAG" >/dev/null
            echo "Backend image exists."
          fi

          if [[ "$FRONTEND_STRATEGY" == "reuse" ]]; then
            echo "Checking frontend image: $FRONTEND_REPO:$FRONTEND_TAG"
            docker manifest inspect "$FRONTEND_REPO:$FRONTEND_TAG" >/dev/null
            echo "Frontend image exists."
          fi

      - name: Configure AWS Credentials Using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialize Terraform Backend
        run: terraform init -input=false

      - name: Select or Create Workspace
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if terraform workspace list | sed 's/^[* ]*//' | grep -Fxq "$TARGET_ENVIRONMENT"; then
            terraform workspace select "$TARGET_ENVIRONMENT"
          else
            terraform workspace new "$TARGET_ENVIRONMENT"
          fi

          echo "Selected workspace: $(terraform workspace show)"

      - name: Update Selected SSM Image Parameters
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BACKEND_STRATEGY: ${{ inputs.backend_strategy }}
          FRONTEND_STRATEGY: ${{ inputs.frontend_strategy }}
          BACKEND_TAG: ${{ inputs.backend_tag }}
          FRONTEND_TAG: ${{ inputs.frontend_tag }}
          BACKEND_REPO: ${{ env.BACKEND_REPO }}
          FRONTEND_REPO: ${{ env.FRONTEND_REPO }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          if [[ "$BACKEND_STRATEGY" == "build" || "$BACKEND_STRATEGY" == "reuse" ]]; then
            aws ssm put-parameter \
              --name "/$ENVIRONMENT/backend-image-tag" \
              --type String \
              --value "$BACKEND_REPO:$BACKEND_TAG" \
              --overwrite \
              --region "$AWS_REGION"

            echo "Backend SSM parameter updated to $BACKEND_REPO:$BACKEND_TAG"
          else
            echo "Backend skipped; existing SSM parameter remains unchanged."
          fi

          if [[ "$FRONTEND_STRATEGY" == "build" || "$FRONTEND_STRATEGY" == "reuse" ]]; then
            aws ssm put-parameter \
              --name "/$ENVIRONMENT/frontend-image-tag" \
              --type String \
              --value "$FRONTEND_REPO:$FRONTEND_TAG" \
              --overwrite \
              --region "$AWS_REGION"

            echo "Frontend SSM parameter updated to $FRONTEND_REPO:$FRONTEND_TAG"
          else
            echo "Frontend skipped; existing SSM parameter remains unchanged."
          fi

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Validate Terraform Configuration
        run: terraform validate

      - name: Generate Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply Terraform Plan
        run: terraform apply -input=false tfplan

      - name: Get Application URL
        id: app-url
        run: |
          echo "url=$(terraform output -raw application_url)" >> "$GITHUB_OUTPUT"

      - name: Publish Deployment Summary
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BACKEND_STRATEGY: ${{ inputs.backend_strategy }}
          FRONTEND_STRATEGY: ${{ inputs.frontend_strategy }}
          BACKEND_TAG: ${{ inputs.backend_tag }}
          FRONTEND_TAG: ${{ inputs.frontend_tag }}
          BACKEND_REPO: ${{ env.BACKEND_REPO }}
          FRONTEND_REPO: ${{ env.FRONTEND_REPO }}
          APP_URL: ${{ steps.app-url.outputs.url }}
        run: |
          {
            echo "### Deployment Summary"
            echo ""
            echo "- **Environment:** $ENVIRONMENT"

            case "$BACKEND_STRATEGY" in
              build)
                echo "- **Backend:** Built and deployed \`$BACKEND_REPO:$BACKEND_TAG\`"
                ;;
              reuse)
                echo "- **Backend:** Reused and deployed \`$BACKEND_REPO:$BACKEND_TAG\`"
                ;;
              skip)
                echo "- **Backend:** Existing image retained"
                ;;
            esac

            case "$FRONTEND_STRATEGY" in
              build)
                echo "- **Frontend:** Built and deployed \`$FRONTEND_REPO:$FRONTEND_TAG\`"
                ;;
              reuse)
                echo "- **Frontend:** Reused and deployed \`$FRONTEND_REPO:$FRONTEND_TAG\`"
                ;;
              skip)
                echo "- **Frontend:** Existing image retained"
                ;;
            esac

            echo "- **Application URL:** $APP_URL"
          } >> "$GITHUB_STEP_SUMMARY"
