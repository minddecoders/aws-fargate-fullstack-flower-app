name: "GitOps - Auto Deploy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select Target Infrastructure Environment Workspace Tier to Deploy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

      existing_image_tag:
        description: "Existing Docker Hub image tag (Leave empty to compile a fresh image build)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-1
  DOCKERHUB_REPOSITORY: minddecoders/aws-fargate-fullstack-app
  TF_VERSION: "1.16.1"

jobs:
  build-and-push-image:
    name: "Compile Server Runtime & Push to DockerHub"
    runs-on: ubuntu-latest
    if: ${{ inputs.existing_image_tag == '' }}
    outputs:
      image_tag: ${{ steps.image-tag.outputs.image_tag }}
    steps:
      - name: "Checkout Codebase Repository"
        uses: actions/checkout@v4

      - name: "Generate Immutable Build Identifier"
        id: image-tag
        run: |
          IMAGE_TAG="v1.${GITHUB_RUN_NUMBER}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: "Log in to DockerHub Registry"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Set Up Docker Buildx Engine"
        uses: docker/setup-buildx-action@v3

      - name: "Build Production Multi-Stage Container Image"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_REPOSITORY }}:${{ steps.image-tag.outputs.image_tag }}

  deploy-application:
    name: "Deploy Stateful Stack to AWS ECS"
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: ${{ always() && (needs.build-and-push-image.result == 'success' || needs.build-and-push-image.result == 'skipped') }}
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash
        working-directory: ./application-infra

    steps:
      - name: "Checkout Repository Code"
        uses: actions/checkout@v4

      - name: "Determine Dynamic Target Container Coordinates"
        id: selected-image
        env:
          EXISTING_IMAGE_TAG: ${{ inputs.existing_image_tag }}
          BUILT_IMAGE_TAG: ${{ needs.build-and-push-image.outputs.image_tag }}
        run: |
          if [ -n "$EXISTING_IMAGE_TAG" ]; then
            IMAGE_TAG="$EXISTING_IMAGE_TAG"
          else
            IMAGE_TAG="$BUILT_IMAGE_TAG"
          fi

          if [ -z "$IMAGE_TAG" ]; then
            echo "🚨 CRITICAL RUNTIME ERROR: Unified target image tracker returned blank string."
            exit 1
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.DOCKERHUB_REPOSITORY }}:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: "Authenticate to AWS using OIDC Keyless Handshake"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::951614974272:role/sidra-github-actions-oidc-execution-role
          aws-region: ${{ env.AWS_REGION }}

      # 🚀 SSM INTEGRATION STEP
      - name: "Publish Approved Image Tag to AWS SSM Parameter Store"
        env:
          IMAGE: ${{ steps.selected-image.outputs.image }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          aws ssm put-parameter \
            --name "/$ENVIRONMENT/fullstack-microservices-image" \
            --type "String" \
            --value "$IMAGE" \
            --region "${{ env.AWS_REGION }}" \
            --overwrite

      - name: "Setup HashiCorp Terraform Engine"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "Initialize S3 Remote Backend Storage Link"
        run: terraform init -input=false

      - name: "Select or Create Isolated Workspace Sandbox Corridor"
        run: |
          if ! terraform workspace select "${{ inputs.environment }}"; then
            terraform workspace new "${{ inputs.environment }}"
          fi

      - name: "Enforce Code Architecture Formatting Regulations"
        run: terraform fmt -check -recursive

      - name: "Execute System Semantics Validation Matrix"
        run: terraform validate

      - name: "Generate Hardware-Locked Execution Spec Sheet Plan"
        env:
          TF_VAR_container_image: ${{ steps.selected-image.outputs.image }}
          TF_VAR_db_password: ${{ secrets.RDS_DB_PASSWORD }}
        run: terraform plan -input=false -out=tfplan

      - name: "Deploy Live Multi-Tier Stateful Microservices Stack"
        env:
          TF_VAR_db_password: ${{ secrets.RDS_DB_PASSWORD }}
        run: terraform apply tfplan

      - name: "Collect Dynamic Outbound Telemetry Link Address"
        id: app-url
        run: |
          ALB_DNS=$(terraform output -raw alb_dns_name)
          echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"

      - name: "Generate Runtime Deployment Executive Summary"
        env:
          IMAGE: ${{ steps.selected-image.outputs.image }}
          ALB_DNS: ${{ steps.app-url.outputs.alb_dns }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          {
            echo "### 🌌 Stateful Microservices Deployment Summary Successful"
            echo "• **Active Target Tier:** \`$ENVIRONMENT\`"
            echo "• **Secure Image Reference Mapping:** \`$IMAGE\`"
            echo "• **Commercial Web Load Balancer URL Address:** http://$ALB_DNS"
          } >> "$GITHUB_STEP_SUMMARY"